# No requiere .env: si no defines SESSION_SECRET/API_KEY_PEPPER, el servidor los
# genera automáticamente y los persiste en ./data/runtime.env (volumen), de modo
# que las API keys y las sesiones sobreviven a los reinicios.
services:
  civitas-access:
    build: .
    ports:
      - '8790:8790'
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/push.sqlite
    volumes:
      - ./data:/app/data
    restart: unless-stopped
